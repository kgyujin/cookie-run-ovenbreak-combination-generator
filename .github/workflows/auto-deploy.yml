name: Trigger Vercel Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

# 저장이 연달아 들어와도 한 번에 하나씩 (빈 커밋끼리 부딪히지 않게)
concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'kgyujin'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Config
        run: |
          git config --global user.name "kgyujin"
          git config --global user.email "k_gyujin@daum.net"

      - name: Push Empty Commit
        run: |
          git pull --rebase origin main
          git commit --allow-empty -m "Trigger Vercel Deploy [Auto]"
          git push origin main
